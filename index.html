<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
/* Layout: sticky header with tabs, one working surface per tab; tables scroll sideways on phones.
   Palette: deep teal (--hema) for stock and purchases, warm orange (--eosin) for sales; names kept from the base app. */
:root{
  --bg:#f5f6fa; --surface:#ffffff; --sunk:#eceef5; --line:#dcdfea;
  --fg:#1b1d2b; --muted:#5d6278;
  --hema:#0d6670; --hema-soft:#dff1f0;
  --eosin:#c2410c; --eosin-soft:#fdeadb;
  --ok:#1f7a55; --ok-soft:#e1f3ea; --warn:#9a6200; --warn-soft:#fbf0d9; --crit:#b42318; --crit-soft:#fde7e4;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12131c; --surface:#1b1d29; --sunk:#232634; --line:#30344a; --fg:#e8e9f2; --muted:#a2a6bd;
  --hema:#5fd0d2; --hema-soft:#123b3e; --eosin:#ffa264; --eosin-soft:#3f2312;
  --ok:#5fd3a0; --ok-soft:#173528; --warn:#f0b54a; --warn-soft:#3a2c10; --crit:#ff8a7a; --crit-soft:#41201c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12131c; --surface:#1b1d29; --sunk:#232634; --line:#30344a; --fg:#e8e9f2; --muted:#a2a6bd;
  --hema:#5fd0d2; --hema-soft:#123b3e; --eosin:#ffa264; --eosin-soft:#3f2312;
  --ok:#5fd3a0; --ok-soft:#173528; --warn:#f0b54a; --warn-soft:#3a2c10; --crit:#ff8a7a; --crit-soft:#41201c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14.5px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px 8px}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand h1{font-family:var(--display);font-size:1.45rem;margin:0;letter-spacing:-.01em;color:var(--hema)}
.brand small{color:var(--muted);font-size:.8rem}
.mode{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.mode.cloud i{background:var(--ok)} .mode.local i{background:var(--warn)}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav button{border:0;background:none;font:600 .9rem var(--body);color:var(--muted);padding:9px 12px;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--fg);border-color:var(--hema)}
main{padding-block:18px 60px}
.btn{font:600 .88rem var(--body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.in{background:var(--hema);border-color:var(--hema);color:var(--surface)}
.btn.out{background:var(--eosin);border-color:var(--eosin);color:var(--surface)}
.btn.in:hover,.btn.out:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.ghost{border-color:transparent;background:none}
:focus-visible{outline:2.5px solid var(--hema);outline-offset:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:14px}
.toolbar .grow{flex:1 1 220px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:60px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:600 .82rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--hema-soft);border-color:var(--hema);color:var(--hema)}
.chip b{font-family:var(--mono);font-weight:600;margin-left:4px;color:var(--muted)}
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap;position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);white-space:nowrap}
td.nm{min-width:200px}
.link{background:none;border:0;padding:0;font:600 .92rem var(--body);color:var(--fg);cursor:pointer;text-align:left}
.link:hover{color:var(--hema);text-decoration:underline}
.sub{font-size:.78rem;color:var(--muted)}
.big{font-family:var(--mono);font-size:1.02rem;font-weight:600}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-crit{background:var(--crit-soft);color:var(--crit)} .p-none{background:var(--sunk);color:var(--muted)}
.p-in{background:var(--hema-soft);color:var(--hema)} .p-out{background:var(--eosin-soft);color:var(--eosin)}
.acts{display:flex;gap:6px;justify-content:flex-end}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.tile:hover{border-color:var(--hema)}
.tile .v{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1.1}
.tile .l{font-weight:600}
.tile.crit .v{color:var(--crit)} .tile.warn .v{color:var(--warn)} .tile.ok .v{color:var(--ok)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cols>*{min-width:0}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
h2{font-family:var(--display);font-size:1.15rem;margin:0 0 10px;text-wrap:balance}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-size:1rem;margin-bottom:4px}
.note{background:var(--hema-soft);color:var(--fg);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;font-size:.9rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note p{margin:0;flex:1 1 260px}
.sum{display:flex;gap:18px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:10px 2px 0}
.sum b{color:var(--fg);font-family:var(--mono)}
/* modal */
.scrim{position:fixed;inset:0;background:rgb(10 10 25 / .45);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;border:1px solid var(--line);box-shadow:0 20px 50px rgb(0 0 0 / .25)}
.modal.wide{max-width:820px}
.mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-family:var(--display);font-size:1.2rem;flex:1;min-width:0}
.mh .tag{width:10px;height:28px;border-radius:3px}
.mb{padding:16px 18px;display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.err{color:var(--crit);font-size:.85rem;font-weight:600}
.hint{font-size:.8rem;color:var(--muted)}
.avail{font-family:var(--mono);font-size:.85rem;padding:8px 10px;border-radius:8px;background:var(--sunk)}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgb(0 0 0 / .15);padding:6px;min-width:230px;z-index:8;display:grid}
.menu .pop button{border:0;background:none;text-align:left;font:500 .88rem var(--body);color:var(--fg);padding:9px 10px;border-radius:7px;cursor:pointer}
.menu .pop button:hover{background:var(--sunk)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.lots{display:grid;gap:6px}
.lot{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:.88rem;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.6}}}
[hidden]{display:none!important}
.inv input{padding:6px 8px}
.inv td.qc{width:110px}.inv td.lc{width:130px}.inv td.pc{width:150px}
.inv tr.touched td{background:var(--hema-soft)}
.ec{font-family:var(--mono);font-weight:600;white-space:nowrap}
.ec.up{color:var(--hema)}.ec.down{color:var(--eosin)}
.savebar{position:sticky;bottom:env(safe-area-inset-bottom,0px);margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 -6px 20px rgb(0 0 0 / .06)}
.savebar p{margin:0;flex:1 1 240px;font-size:.9rem}
@media (max-width:560px){.hide-sm{display:none}.menu .pop{right:auto;left:0}}

/* ===== relief / 3D layer ===== */
:root{--hema2:#17939b;--eosin2:#ea6a22;--teal:#1d8a8a;--teal2:#2fb5a8;--amber:#c27a00;--amber2:#f0a92e;
  --sh1:0 1px 0 rgb(255 255 255 / .7) inset,0 1px 2px rgb(15 50 55 / .08),0 6px 14px -4px rgb(15 50 55 / .14);
  --sh2:0 1px 0 rgb(255 255 255 / .8) inset,0 2px 4px rgb(15 50 55 / .08),0 14px 30px -10px rgb(10 70 75 / .28);
  --bg-grad:radial-gradient(1200px 500px at 10% -10%,#d7efed 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#fde6d4 0,transparent 55%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hema2:#38b3b8;--eosin2:#f08a3c;--teal:#3cc7b8;--teal2:#2a9d93;--amber:#f0b54a;--amber2:#c9881b;
  --sh1:0 1px 0 rgb(255 255 255 / .06) inset,0 1px 2px rgb(0 0 0 / .4),0 6px 14px -4px rgb(0 0 0 / .5);
  --sh2:0 1px 0 rgb(255 255 255 / .07) inset,0 2px 4px rgb(0 0 0 / .4),0 14px 30px -10px rgb(0 0 0 / .7);
  --bg-grad:radial-gradient(1200px 500px at 10% -10%,#0e3b3e 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#3d2611 0,transparent 55%)}}
:root[data-theme="dark"]{--hema2:#38b3b8;--eosin2:#f08a3c;--teal:#3cc7b8;--teal2:#2a9d93;--amber:#f0b54a;--amber2:#c9881b;
  --sh1:0 1px 0 rgb(255 255 255 / .06) inset,0 1px 2px rgb(0 0 0 / .4),0 6px 14px -4px rgb(0 0 0 / .5);
  --sh2:0 1px 0 rgb(255 255 255 / .07) inset,0 2px 4px rgb(0 0 0 / .4),0 14px 30px -10px rgb(0 0 0 / .7);
  --bg-grad:radial-gradient(1200px 500px at 10% -10%,#0e3b3e 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#3d2611 0,transparent 55%)}
body{background:var(--bg-grad),var(--bg);background-attachment:fixed}
header{background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 88%,var(--hema-soft)));box-shadow:0 8px 24px -14px rgb(10 70 75 / .35);border-bottom:0}
.brand h1{background:linear-gradient(100deg,var(--hema) 10%,var(--hema2) 55%,var(--eosin) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.6rem}
nav{gap:6px;padding-bottom:10px}
nav button{border:0;border-radius:999px;padding:8px 14px}
nav button[aria-selected="true"]{color:#fff;background:linear-gradient(180deg,var(--hema2),var(--hema));box-shadow:0 1px 0 rgb(255 255 255 / .35) inset,0 6px 14px -6px var(--hema)}
.btn{box-shadow:var(--sh1);border-color:color-mix(in srgb,var(--line) 70%,transparent);transition:transform .08s ease,box-shadow .12s ease,filter .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 2px rgb(0 0 0 / .15) inset}
.btn.in{background:linear-gradient(180deg,var(--hema2),var(--hema));border-color:transparent;color:#fff;box-shadow:0 1px 0 rgb(255 255 255 / .35) inset,0 -2px 0 rgb(0 0 0 / .18) inset,0 8px 16px -6px var(--hema)}
.btn.out{background:linear-gradient(180deg,var(--eosin2),var(--eosin));border-color:transparent;color:#fff;box-shadow:0 1px 0 rgb(255 255 255 / .35) inset,0 -2px 0 rgb(0 0 0 / .18) inset,0 8px 16px -6px var(--eosin)}
.btn.ghost{box-shadow:none}
.btn:disabled{opacity:.5;transform:none;cursor:not-allowed}
.tile{position:relative;overflow:hidden;border:0;box-shadow:var(--sh2);padding:18px 18px 16px;transition:transform .15s ease,box-shadow .15s ease}
.tile::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.tile::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 35%,color-mix(in srgb,var(--c2) 45%,transparent),transparent 70%);opacity:.55}
.tile:hover{transform:translateY(-3px) perspective(600px) rotateX(2deg)}
.tile.ok{--c1:var(--teal);--c2:var(--teal2)} .tile.crit{--c1:var(--eosin);--c2:var(--eosin2)} .tile.warn{--c1:var(--amber);--c2:var(--amber2)}
.tile .v{font-size:2.3rem;text-shadow:0 2px 0 rgb(0 0 0 / .06)}
.tablebox{border:0;box-shadow:var(--sh2)}
th{background:linear-gradient(180deg,var(--sunk),color-mix(in srgb,var(--sunk) 70%,var(--surface)))}
tbody tr{transition:background .1s}
tbody tr:hover td{background:color-mix(in srgb,var(--hema-soft) 45%,transparent)}
.chip{box-shadow:var(--sh1);border-color:transparent;padding:7px 14px 7px 10px;display:inline-flex;align-items:center;gap:7px}
.chip::before{content:"";width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--k2) 40%,var(--k1) 100%);box-shadow:0 1px 2px rgb(0 0 0 / .25)}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,var(--surface),var(--hema-soft));color:var(--fg);box-shadow:0 0 0 2px var(--k1),var(--sh1)}
.chip{--k1:var(--muted);--k2:var(--line)}
.chip[data-cat="anticorps"],.chip[data-invcat="anticorps"]{--k1:var(--hema);--k2:var(--hema2)}
.chip[data-cat="chimiques"],.chip[data-invcat="chimiques"]{--k1:var(--teal);--k2:var(--teal2)}
.chip[data-cat="fongibles"],.chip[data-invcat="fongibles"]{--k1:var(--amber);--k2:var(--amber2)}
.chip[data-cat="all"]{--k1:var(--eosin);--k2:var(--eosin2)}
.pill{box-shadow:0 1px 0 rgb(255 255 255 / .5) inset,0 1px 2px rgb(0 0 0 / .08)}
.modal{border:0;box-shadow:0 30px 70px -20px rgb(5 40 45 / .55),0 0 0 1px var(--line)}
.mh{background:linear-gradient(180deg,var(--hema-soft),transparent);border-radius:14px 14px 0 0}
.note{box-shadow:var(--sh1);background:linear-gradient(135deg,var(--hema-soft),color-mix(in srgb,var(--eosin-soft) 50%,var(--hema-soft)))}
.savebar{border:0;box-shadow:var(--sh2)}
input,select,textarea{box-shadow:0 1px 2px rgb(0 0 0 / .06) inset}
.big{color:var(--hema)}
@media (prefers-reduced-motion:reduce){.btn,.tile{transition:none}.btn:hover,.tile:hover{transform:none}}

.tile.hema{--c1:var(--hema);--c2:var(--hema2)} .tile.hema .v{color:var(--hema)}
.tile.eos{--c1:var(--eosin);--c2:var(--eosin2)} .tile.eos .v{color:var(--eosin)}
.tile .v.money{font-size:1.65rem;font-family:var(--display)}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.tot{display:grid;grid-template-columns:auto auto;gap:4px 18px;justify-content:end;font-variant-numeric:tabular-nums;margin-top:4px}
.tot span:nth-child(odd){color:var(--muted);text-align:right}.tot span:nth-child(even){text-align:right;font-family:var(--mono);font-weight:600}
.tot .grand{font-size:1.15rem;color:var(--eosin)}
.ln{display:grid;grid-template-columns:minmax(0,1fr) 90px 120px 70px 110px auto;gap:8px;align-items:end}
.ln .lt{font-family:var(--mono);font-weight:600;padding-bottom:9px;text-align:right}
@media (max-width:640px){.ln{grid-template-columns:1fr 1fr 1fr}.ln .wide{grid-column:1/-1}.ln .lt{text-align:left}}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;font:600 .84rem var(--body);color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--sh1)}
.setup{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:18px}
.setup .stp{background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh2);display:flex;flex-direction:column;gap:8px}
.setup .stp.done{opacity:.6}
.setup .stp b{font-family:var(--display);font-size:1.02rem}
.tag-k{display:inline-block;font-family:var(--mono);font-size:.74rem;color:var(--muted);background:var(--sunk);padding:1px 6px;border-radius:5px}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,180px) 1fr auto;gap:10px;align-items:center;font-size:.86rem}
.bar .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr,.bar .fl{display:block}.bar .tr{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar .fl{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--eosin),var(--eosin2))}
.bar .n{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
@media (max-width:560px){.tiles{grid-template-columns:1fr 1fr;gap:10px}.tile{padding:12px}.tile .v{font-size:1.6rem}.tile .v.money{font-size:1.12rem}.tile .sub{font-size:.74rem}}
.ln{grid-template-columns:minmax(0,1fr) 82px 112px 78px 66px 104px auto}
@media (max-width:640px){.ln{grid-template-columns:1fr 1fr 1fr}.ln .wide{grid-column:1/-1}}
.scanbar{display:flex;gap:8px;align-items:end;flex-wrap:wrap;background:var(--sunk);padding:10px 12px;border-radius:10px}
.scanbar .grow{flex:1 1 240px}
.tile.amber{--c1:var(--amber);--c2:var(--amber2)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <h1 id="orgName">Rasid</h1>

<script>
"use strict";
/* =================== état =================== */
const LOCAL_KEY="rasid.v1";
const COLS=["articles","categories","mouvements","pieces","tiers","config"];
const S={articles:new Map(),cats:new Map(),mvts:new Map(),pieces:new Map(),tiers:new Map(),config:new Map(),
  mode:"loading",user:"",online:true,tab:"home",ready:{a:false,m:false},
  af:{cat:"all",q:"",statut:"all"},vf:{from:"",to:"",q:"",statut:"all"},df:{from:"",to:"",q:"",statut:"all"},hf:{from:"",to:"",q:"",statut:"all"},
  mf:{from:"",to:"",type:"all",q:""},tf:{type:"client",q:""},rf:{view:"ventes",from:"",to:"",cat:"all"},
  bes:{ref:3,horizon:1,secu:0.5},inv:{date:"",cat:"",q:"",rows:{}},invBusy:false};
const mapOf=col=>({articles:S.articles,categories:S.cats,pieces:S.pieces,tiers:S.tiers,config:S.config})[col]||S.mvts;
const PAYMODES=["Espèces","Carte bancaire","Chèque","Virement","À crédit"];
const MOTIFS_OUT=["Perte / casse","Produit périmé","Usage interne","Retour fournisseur","Correction"];
const MOTIFS_IN=["Retour client","Don / échantillon","Correction"];

/* =================== utilitaires =================== */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fdate=iso=>iso?iso.split("-").reverse().join("/"):"";
const fnum=n=>(Math.round((+n||0)*1000)/1000).toLocaleString("fr-FR");
const r2=n=>Math.round((+n||0)*100)/100;
const org=()=>S.config.get("org")||{};
const dev=()=>org().devise||"DH";
const fm=n=>(r2(n)).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" "+dev();
const fm0=n=>Math.round(+n||0).toLocaleString("fr-FR")+" "+dev();
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const monthStart=()=>today().slice(0,8)+"01";
const num=v=>{const x=parseFloat(String(v??"").replace(/\s/g,"").replace(",","."));return isFinite(x)?x:NaN};
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
let saveT=null;
function lsGet(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||"null")}catch{return null}}
function lsSave(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LOCAL_KEY,JSON.stringify({articles:Object.fromEntries(S.articles),cats:Object.fromEntries(S.cats),mvts:Object.fromEntries(S.mvts),pieces:Object.fromEntries(S.pieces),tiers:Object.fromEntries(S.tiers),config:Object.fromEntries(S.config)}))}catch{toast("Enregistrement local impossible sur ce navigateur")}},150)}
function enLettres(n){
  const u=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize"];
  const d=["","dix","vingt","trente","quarante","cinquante","soixante","soixante","quatre-vingt","quatre-vingt"];
  const lt100=n=>{if(n<17)return u[n];if(n<20)return "dix-"+u[n-10];const t=Math.floor(n/10),r=n%10;
    if(t===7||t===9){const rr=10+r;return d[t]+(t===7&&r===1?" et ":"-")+(rr<17?u[rr]:"dix-"+u[rr-10])}
    if(r===0)return t===8?"quatre-vingts":d[t];if(r===1&&t<8)return d[t]+" et un";return d[t]+"-"+u[r]};
  const lt1000=n=>{const c=Math.floor(n/100),r=n%100;let s="";if(c)s=c===1?"cent":u[c]+" cent"+(r===0?"s":"");if(r)s+=(s?" ":"")+lt100(r);return s||"zéro"};
  const full=n=>{if(n===0)return "zéro";let s="";const mi=Math.floor(n/1e6),k=Math.floor(n%1e6/1000),r=n%1000;
    if(mi)s+=mi===1?"un million":lt1000(mi).replace(/(cent|vingt)s$/,"$1")+" millions";
    if(k)s+=(s?" ":"")+(k===1?"mille":lt1000(k).replace(/(cent|vingt)s$/,"$1")+" mille");
    if(r)s+=(s?" ":"")+lt1000(r);return s};
  const e=Math.floor(n+1e-9),c=Math.round((n-e)*100);const dv=/^(dh|mad|dirham)/i.test(dev());
  const unit=dv?" dirham":" "+dev();return full(e)+unit+(e>1&&dv?"s":"")+(c?" et "+full(c)+" centime"+(c>1?"s":""):"")}

/* =================== stockage : Supabase (hors ligne), ou ce navigateur =================== */
const Store={sb:null,queue:[],flushing:false,CK:"rasid.cache",QK:"rasid.queue",
  lsg(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch{return null}},
  lss(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}},
  async init(){
    if(window.SUPA_MODE)return this.initSupa();
    S.mode="local";const d=lsGet()||{};const M=o=>new Map(Object.entries(o||{}).map(([k,v])=>[k,{...v,id:k}]));
    S.articles=M(d.articles);S.cats=M(d.cats);S.mvts=M(d.mvts);S.pieces=M(d.pieces);S.tiers=M(d.tiers);S.config=M(d.config);
    S.ready.a=S.ready.m=true;render();
  },
  saveCache(){clearTimeout(this.ct);this.ct=setTimeout(()=>{const docs=[];
    for(const c of COLS)for(const [id,v] of mapOf(c)){const d={...v};delete d.id;docs.push([c,id,d])}
    if(!this.lss(this.CK,{user:S.user,at:new Date().toISOString(),docs}))toast("Mémoire de l'appareil pleine : la copie hors ligne n'a pas pu être mise à jour")},300)},
  fromDocs(docs){const g=c=>new Map(docs.filter(r=>r[0]===c).map(r=>[r[1],{...r[2],id:r[1]}]));
    S.articles=g("articles");S.cats=g("categories");S.mvts=g("mouvements");S.pieces=g("pieces");S.tiers=g("tiers");S.config=g("config")},
  applyLocal(o){const m=mapOf(o.col);if(o.op==="del")m.delete(o.id);else m.set(o.id,{...o.data,id:o.id})},
  async initSupa(){
    if(!window.SUPA_URL||!window.SUPA_KEY||!window.supabase){S.mode="setup";S.ready.a=S.ready.m=true;render();return}
    this.sb=window.supabase.createClient(window.SUPA_URL,window.SUPA_KEY);this.queue=this.lsg(this.QK)||[];
    this.sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"){S.mode="login";S.user="";render()}});
    window.addEventListener("online",()=>{S.online=true;this.resync()});
    window.addEventListener("offline",()=>{S.online=false;render()});
    setInterval(()=>{if(this.queue.length||!S.online)this.resync()},30000);
    let session=null;try{session=(await this.sb.auth.getSession()).data.session}catch{}
    const cache=this.lsg(this.CK);
    if(cache&&cache.docs&&(session?((session.user.email||"")===cache.user):true)){
      S.user=cache.user;S.mode="supa";this.fromDocs(cache.docs);for(const o of this.queue)this.applyLocal(o);
      S.ready.a=S.ready.m=true;S.online=false;render();if(session)this.loadSupa(session.user);else this.resync();return}
    if(!session){S.mode="login";S.ready.a=S.ready.m=true;render();return}
    await this.loadSupa(session.user);
  },
  async resync(){if(this.syncing)return;this.syncing=true;try{const {data}=await this.sb.auth.getSession();if(data&&data.session)await this.loadSupa(data.session.user)}catch{}finally{this.syncing=false}},
  async login(email,pw){const {data,error}=await this.sb.auth.signInWithPassword({email,password:pw});if(error)throw error;
    const c=this.lsg(this.CK);if(c&&c.user!==data.user.email){try{localStorage.removeItem(this.CK)}catch{};this.queue=[];this.lss(this.QK,[])}
    await this.loadSupa(data.user)},
  async logout(force){
    if(this.queue.length&&!force){openModal(`<div class="mh"><h3>Modifications pas encore envoyées</h3><button class="btn ghost" type="button" data-close aria-label="Fermer">✕</button></div>
      <div class="mb"><p style="margin:0"><b>${this.queue.length}</b> modification(s) faite(s) hors ligne n'ont pas encore été envoyées. Reconnectez l'appareil à internet et attendez « En ligne » avant de vous déconnecter, sinon elles seront perdues.</p></div>
      <div class="mf"><button class="btn danger" type="button" id="lgForce">Se déconnecter quand même</button><button class="btn in" type="button" data-close>Rester connecté</button></div>`);
      $("#lgForce").addEventListener("click",()=>{closeModal();this.logout(true)});return}
    try{await this.sb.auth.signOut()}catch{};try{localStorage.removeItem(this.CK);localStorage.removeItem(this.QK)}catch{};this.queue=[];S.mode="login";S.user="";render()},
  async loadSupa(user){
    const first=!S.ready.a||S.mode!=="supa";S.user=user.email||"";S.mode="supa";
    if(first&&!this.lsg(this.CK)){S.ready.a=S.ready.m=false;render()}
    await this.flush();
    try{const all=[];for(let from=0;;from+=1000){const {data,error}=await this.sb.from("docs").select("col,id,data").range(from,from+999);if(error)throw error;all.push(...data);if(data.length<1000)break}
      this.fromDocs(all.map(r=>[r.col,r.id,r.data]));for(const o of this.queue)this.applyLocal(o);S.online=true;
    }catch(e){S.online=false;S.ready.a=S.ready.m=true;if(!this.lsg(this.CK)&&!S.articles.size)S.mode="neterr";render();return}
    S.ready.a=S.ready.m=true;this.saveCache();render();
    if(!this.chan)this.chan=this.sb.channel("docs-live").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
      const r=p.eventType==="DELETE"?p.old:p.new;if(!r||!r.col)return;const m=mapOf(r.col);
      if(p.eventType==="DELETE")m.delete(r.id);else m.set(r.id,{...r.data,id:r.id});for(const o of this.queue)if(o.col===r.col&&o.id===r.id)this.applyLocal(o);this.saveCache();render()}).subscribe();
  },
  async flush(){if(this.flushing||!this.queue.length)return;this.flushing=true;let sent=0;
    try{while(this.queue.length){const o=this.queue[0];let res;
        try{res=o.op==="del"?await this.sb.from("docs").delete().eq("col",o.col).eq("id",o.id):await this.sb.from("docs").upsert({col:o.col,id:o.id,data:o.data})}catch(e){S.online=false;break}
        if(res.error){const m=res.error.message||"";if(/fetch|network|Failed|timeout/i.test(m)||!res.error.code){S.online=false;break}toast("Une modification a été refusée par le serveur : "+m)}
        this.queue.shift();this.lss(this.QK,this.queue);sent++;S.online=true}
    }finally{this.flushing=false;render();if(sent&&!this.queue.length&&sent>3)toast(sent+" modification(s) envoyée(s)")}},
  async put(col,id,data){const body={...data};delete body.id;
    if(this.sb){const o={op:"put",col,id,data:body};this.applyLocal(o);this.queue.push(o);this.lss(this.QK,this.queue);this.saveCache();render();this.flush();return}
    mapOf(col).set(id,{...body,id});lsSave();render()},
  async del(col,id){
    if(this.sb){const o={op:"del",col,id};this.applyLocal(o);this.queue.push(o);this.lss(this.QK,this.queue);this.saveCache();render();this.flush();return}
    mapOf(col).delete(id);lsSave();render()}
};
async function safe(fn,okMsg){try{await fn();if(okMsg)toast(okMsg);return true}catch(e){toast("Échec de l'enregistrement, réessayez.");return false}}
/* écritures groupées : un seul rendu à la fin */
async function batch(fn){const r=window.render;let n=0;window.render=()=>{n++};try{await fn()}finally{window.render=r;render()}}

/* =================== catégories, articles =================== */
let CATS={},CAT_KEYS=[];
function syncCats(){CATS={};[...S.cats.values()].sort((a,b)=>(a.ordre||0)-(b.ordre||0)||a.label.localeCompare(b.label)).forEach(c=>{CATS[c.id]={label:c.label,lot:!!c.lot}});CAT_KEYS=Object.keys(CATS)}
const catLabel=k=>CATS[k]?.label||"Sans catégorie";
const CATCOL=[["--hema","--hema2"],["--eosin","--eosin2"],["--teal","--teal2"],["--amber","--amber2"],["--ok","--teal2"],["--crit","--eosin2"]];
const catDot=k=>{const i=CAT_KEYS.indexOf(k);if(i<0)return "";const [a,b]=CATCOL[i%CATCOL.length];return `style="--k1:var(${a});--k2:var(${b})"`};
const sortedArticles=()=>[...S.articles.values()].sort((a,b)=>CAT_KEYS.indexOf(a.cat)-CAT_KEYS.indexOf(b.cat)||a.nom.localeCompare(b.nom,"fr"));
const artLabel=a=>(a.ref?a.ref+" · ":"")+a.nom;
function findArt(label){label=String(label||"").trim();if(!label)return null;
  for(const a of S.articles.values())if(artLabel(a)===label)return a;
  const n=norm(label);const byRef=[...S.articles.values()].filter(a=>a.ref&&norm(a.ref)===n);if(byRef.length===1)return byRef[0];
  const hits=[...S.articles.values()].filter(a=>norm(a.nom)===n);return hits.length===1?hits[0]:null}
const artOptions=()=>sortedArticles().map(a=>`<option value="${esc(artLabel(a))}"></option>`).join("");
const tvaOf=a=>a&&a.tva!=null&&a.tva!==""?+a.tva:(org().tva!=null?+org().tva:20);

/* =================== calculs : stock, coût moyen pondéré (CUMP), lots =================== */
function compute(){
  const st=new Map(),cost=new Map(),byPiece=new Map();
  for(const a of S.articles.values())st.set(a.id,{in:0,out:0,stock:0,n:0,last:"",lots:new Map(),q:0,v:0,cump:+a.pa||0,unl:0});
  const ms=[...S.mvts.values()].sort((x,y)=>(x.date+(x.createdAt||"")).localeCompare(y.date+(y.createdAt||"")));
  for(const m of ms){if(m.pieceId){const l=byPiece.get(m.pieceId);if(l)l.push(m);else byPiece.set(m.pieceId,[m])}const s=st.get(m.articleId);if(!s)continue;const q=+m.qte||0;s.n++;if(m.date>s.last)s.last=m.date;const lk=(m.lot||"").trim();
    if(m.type==="entree"){const pu=m.pu!=null&&m.pu!==""?+m.pu:(s.q>0?s.v/s.q:s.cump);s.in+=q;
      if(s.q<0){s.v=0;s.q=0} s.v+=q*pu;s.q+=q;if(s.q>0)s.cump=s.v/s.q;
      if(lk||m.peremption){const L=s.lots.get(lk)||{lot:lk,qte:0,peremption:""};L.qte+=q;if(m.peremption&&(!L.peremption||m.peremption<L.peremption))L.peremption=m.peremption;s.lots.set(lk,L)}}
    else{const c=s.q>0?s.v/s.q:s.cump;s.out+=q;cost.set(m.id,q*c);s.v-=q*c;s.q-=q;if(Math.abs(s.q)<1e-9){s.q=0;s.v=0}
      if(lk&&s.lots.has(lk))s.lots.get(lk).qte-=q;else if(!lk)s.unl+=q}}
  for(const [id,s] of st){s.stock=s.in-s.out;s.valeur=Math.max(s.stock,0)*s.cump;
    let unl=s.unl;
    for(const L of [...s.lots.values()].sort((a,b)=>(a.peremption||"9").localeCompare(b.peremption||"9"))){if(unl<=0)break;const t=Math.min(Math.max(L.qte,0),unl);L.qte-=t;unl-=t}}
  return {st,cost,byPiece};
}
function statusOf(a,s){
  if(!s||s.n===0)return{k:"none",t:"Non saisi",c:"p-none"};
  if(s.stock<=0)return{k:"crit",t:"Rupture",c:"p-crit"};
  if((+a.seuil||0)>0&&s.stock<=+a.seuil)return{k:"warn",t:"Stock bas",c:"p-warn"};
  return{k:"ok",t:"Disponible",c:"p-ok"}}
function expiring(st,days){const lim=addDays(today(),days),t=today(),out=[];
  for(const [id,s] of st){const a=S.articles.get(id);if(!a)continue;for(const L of s.lots.values())if(L.qte>0&&L.peremption&&L.peremption<=lim)out.push({a,L,expired:L.peremption<t})}
  return out.sort((x,y)=>x.L.peremption.localeCompare(y.L.peremption))}
const pieceReste=p=>p.type==="devis"?0:r2((+p.totalTTC||0)-(+p.paye||0));
const piecesOf=type=>[...S.pieces.values()].filter(p=>p.type===type);
function salesIn(from,to){return piecesOf("vente").filter(p=>(!from||p.date>=from)&&(!to||p.date<=to))}
function marginOf(pieces,C){let ht=0,c=0;for(const p of pieces){ht+=+p.totalHT||0;for(const m of C.byPiece.get(p.id)||[])c+=C.cost.get(m.id)||0}return {ht,cost:c,marge:ht-c}}

/* =================== rendu =================== */
function render(){
  syncCats();
  const O=org();$("#orgName").textContent=O.nom||"Rasid";$("#orgSub").textContent=O.nom?(O.activite||"Stock, achats et ventes"):"Stock, achats et ventes";
  document.title=O.nom?O.nom+" — Rasid":"Rasid";
  const m=$("#mode");
  m.className="mode "+(S.mode==="supa"?(S.online&&!Store.queue.length?"cloud":"local"):S.mode);
  m.querySelector("span").textContent=S.mode==="supa"?(S.online?"En ligne · "+S.user:"Hors ligne · "+S.user)+(Store.queue.length?" · "+Store.queue.length+" en attente":""):S.mode==="local"?"Enregistré sur ce PC":S.mode==="login"?"Non connecté":"Chargement…";
  const gate=["login","setup","neterr"].includes(S.mode);["bAchat","bVente","bMenu"].forEach(i=>{const e=document.getElementById(i);if(e)e.hidden=gate});$("#tabs").hidden=gate;
  $("#bLogout").hidden=S.mode!=="supa";$("#bPw").hidden=S.mode!=="supa";$("#bDemo").hidden=S.articles.size>0;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  const v=$("#view");
  if(gate){if(S.mode==="login"&&$("#lf"))return;v.innerHTML=vGate();return}
  if(!(S.ready.a&&S.ready.m)){v.innerHTML='<div class="empty"><strong>Chargement…</strong></div>';return}
  const ae=document.activeElement,keep=ae&&ae.id&&v.contains(ae)?ae.id:null;let pos=null;try{pos=keep?ae.selectionStart:null}catch{}
  const C=compute();
  v.innerHTML={home:vHome,arts:vArts,ventes:()=>vPieces("vente"),devis:()=>vPieces("devis"),achats:()=>vPieces("achat"),mvts:vMvts,tiers:vTiers,inv:vInv,rap:vRap}[S.tab](C);
  if(keep){const el=document.getElementById(keep);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch{}}}
}
window.render=render;
function vGate(){
  if(S.mode==="setup")return `<div class="tablebox" style="max-width:520px;margin:40px auto;padding:24px"><h2>Configuration manquante</h2><p>Le fichier <code>config.js</code> ne contient pas encore l'adresse et la clé du projet Supabase.</p></div>`;
  if(S.mode==="neterr")return `<div class="tablebox" style="max-width:520px;margin:40px auto;padding:24px"><h2>Pas de connexion</h2><p>Impossible de joindre la base de données. Vérifiez la connexion internet puis rechargez la page.</p><button class="btn in" type="button" onclick="location.reload()">Recharger</button></div>`;

    ${!S.articles.size?`<div class="note"><p>Pour découvrir l'application avant de saisir vos propres données, chargez un magasin d'exemple. Vous pourrez tout effacer ensuite (menu Données).</p><button class="btn" type="button" data-act="demo">Charger des données d'exemple</button></div>`:""}`:"";
  if(!S.articles.size)return setup;

  const caJ=vj.reduce((a,p)=>a+(+p.totalTTC||0),0),caM=vm.reduce((a,p)=>a+(+p.totalTTC||0),0);
  let valeur=0;for(const s of st.values())valeur+=s.valeur;
  const credit=piecesOf("vente").reduce((a,p)=>a+Math.max(pieceReste(p),0),0),dette=piecesOf("achat").reduce((a,p)=>a+Math.max(pieceReste(p),0),0);
  let rupt=0,bas=0;const alerts=[];for(const a of sortedArticles()){const k=statusOf(a,st.get(a.id));if(k.k==="crit")rupt++;if(k.k==="warn")bas++;if(k.k==="crit"||k.k==="warn")alerts.push({a,s:st.get(a.id),k})}
  const exp=expiring(st,60);
  const top=new Map();for(const p of vm)for(const l of p.lignes||[]){const x=top.get(l.articleId)||{nom:l.nom,q:0,ttc:0};x.q+=+l.qte||0;x.ttc+=+l.totalTTC||0;top.set(l.articleId,x)}
  const tops=[...top.values()].sort((a,b)=>b.ttc-a.ttc).slice(0,7);const mx=tops[0]?.ttc||1;
  const last=piecesOf("vente").sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt)).slice(0,7);
  return `${setup}
  <div class="tiles">
    <button class="tile eos" type="button" data-tab="ventes"><span class="v money">${fm0(caJ)}</span><span class="l">Ventes du jour</span><span class="sub">${vj.length} vente(s) aujourd'hui</span></button>
    <button class="tile eos" type="button" data-goto="rap"><span class="v money">${fm0(caM)}</span><span class="l">Ventes du mois</span><span class="sub">marge ${fm0(mm.marge)}${mm.ht?" · "+Math.round(mm.marge/mm.ht*100)+" %":""}</span></button>
    <button class="tile hema" type="button" data-goto="valo"><span class="v money">${fm0(valeur)}</span><span class="l">Valeur du stock</span><span class="sub">au coût d'achat moyen</span></button>
    <button class="tile ${credit>0?"warn":"ok"}" type="button" data-goto="credit"><span class="v money">${fm0(credit)}</span><span class="l">À encaisser</span><span class="sub">ventes à crédit${dette>0?" · à payer fournisseurs "+fm0(dette):""}</span></button>
  </div>
  <div class="tiles">
    <button class="tile crit" type="button" data-gotoa="crit"><span class="v">${rupt}</span><span class="l">En rupture</span><span class="sub">stock à zéro</span></button>
    <button class="tile warn" type="button" data-gotoa="warn"><span class="v">${bas}</span><span class="l">Stock bas</span><span class="sub">sous le seuil d'alerte</span></button>
    ${exp.length?`<button class="tile warn" type="button" data-gotoa="exp"><span class="v">${exp.length}</span><span class="l">Lots à surveiller</span><span class="sub">${exp.filter(e=>e.expired).length} périmé(s) · expirent sous 60 jours</span></button>`:""}
    <button class="tile hema" type="button" data-tab="arts"><span class="v">${S.articles.size}</span><span class="l">Articles</span><span class="sub">${CAT_KEYS.length} catégorie(s)</span></button>
  </div>
  <div class="cols">
    <section><h2>Meilleures ventes du mois</h2><div class="tablebox" style="padding:14px">${tops.length?`<div class="bars">${tops.map(x=>`<div class="bar"><span class="t">${esc(x.nom)}</span><span class="tr"><span class="fl" style="width:${Math.max(3,x.ttc/mx*100)}%"></span></span><span class="n">${fm0(x.ttc)}</span></div>`).join("")}</div>`:`<div class="empty">Aucune vente ce mois-ci.</div>`}</div></section>
    <section><h2>Dernières ventes</h2><div class="tablebox">${last.length?`<table><thead><tr><th>N°</th><th>Date</th><th>Client</th><th class="num">Total</th></tr></thead><tbody>${last.map(p=>`<tr><td><button class="link" type="button" data-piece="${p.id}">${esc(p.num)}</button></td><td>${fdate(p.date)}</td><td>${esc(p.tiersNom||"Client comptoir")}</td><td class="num">${fm(p.totalTTC)}${pieceReste(p)>0?` <span class="pill p-warn">crédit</span>`:""}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">Aucune vente enregistrée.</div>`}</div></section>
  </div>

  ${exp.length?`<section style="margin-top:20px"><h2>Péremptions</h2><div class="tablebox"><table><thead><tr><th>Article</th><th>Lot</th><th>Expire le</th><th class="num">Reste</th></tr></thead><tbody>${exp.slice(0,10).map(e=>`<tr><td><button class="link" type="button" data-art="${e.a.id}">${esc(e.a.nom)}</button></td><td>${esc(e.L.lot||"—")}</td><td><span class="pill ${e.expired?"p-crit":"p-warn"}">${fdate(e.L.peremption)}</span></td><td class="num">${fnum(e.L.qte)}</td></tr>`).join("")}</tbody></table></div></section>`:""}`;
}
function emptyArts(){return `<div class="tablebox"><div class="empty"><strong>Aucun article pour l'instant</strong>Ajoutez vos articles un par un, ou remplissez le modèle Excel puis importez-le.<div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap"><button class="btn in" data-act="newart" type="button">Ajouter un article</button><button class="btn" data-act="model" type="button">Télécharger le modèle Excel</button><button class="btn" data-act="import" type="button">Importer</button></div></div></div>`}

/* ---------- articles ---------- */

    <button class="btn" type="button" data-cam="search" title="Retrouver un article par son code-barres">📷 Scanner</button><button class="btn in" type="button" data-act="newart">＋ Article</button></div>
  <div class="tablebox"><table><thead><tr><th>Article</th><th class="num hide-sm">Prix d'achat HT</th><th class="num">Prix de vente TTC</th><th class="num hide-sm">Marge</th><th class="num">Stock</th><th class="num hide-sm">Valeur</th><th>Statut</th><th class="num"></th></tr></thead><tbody>
  ${rows.map(a=>{const s=st.get(a.id),k=statusOf(a,s);const pvht=(+a.pv||0)/(1+tvaOf(a)/100);const mg=pvht>0?(pvht-s.cump)/pvht*100:null;return `<tr>
    <td class="nm"><button class="link" type="button" data-art="${a.id}">${esc(a.nom)}</button><div class="sub">${a.ref?`<span class="tag-k">${esc(a.ref)}</span> `:""}${F.cat==="all"?esc(catLabel(a.cat))+" · ":""}${esc(a.unite||"")}</div></td>
    <td class="num hide-sm">${fm(a.pa)}</td><td class="num">${fm(a.pv)}</td>

    <td class="num big">${fnum(s.stock)}</td><td class="num hide-sm">${fm0(s.valeur)}</td>

  </tbody></table></div>
  <div class="sum"><span><b>${rows.length}</b> article(s)</span><span>Valeur au coût moyen : <b>${fm(tv)}</b></span>${F.statut!=="all"||F.q?`<button class="btn sm" type="button" data-act="clearf">Effacer les filtres</button>`:""}</div>`}

/* ---------- ventes / achats ---------- */
function vPieces(type){
  const isV=type==="vente",isD=type==="devis",isA=type==="achat";const F=isV?S.vf:isD?S.df:S.hf,q=norm(F.q);const pre=isV?"v":isD?"d":"h";
  const stOk=p=>F.statut==="all"||(isD?devisState(p).k===F.statut:(F.statut==="due"?pieceReste(p)>0.004:pieceReste(p)<=0.004));
  const rows=piecesOf(type).filter(p=>(!F.from||p.date>=F.from)&&(!F.to||p.date<=F.to)&&stOk(p)&&(!q||norm(p.num+" "+(p.tiersNom||"")+" "+(p.lignes||[]).map(l=>l.nom).join(" ")).includes(q)))

    ${isD?"":`<button class="btn" type="button" data-act="x${type}">Exporter (Excel)</button>`}

  <div class="tablebox"><table><thead><tr><th>N°</th><th>Date</th><th>${isA?"Fournisseur":"Client"}</th><th class="hide-sm">Articles</th><th class="num">Total TTC</th>${isD?"<th>Valable jusqu'au</th><th>État</th>":"<th class=\"num\">Reste</th><th>Paiement</th>"}<th class="num"></th></tr></thead><tbody>
  ${rows.map(p=>{const r=pieceReste(p);const ds=isD?devisState(p):null;return `<tr><td style="font-family:var(--mono);white-space:nowrap"><button class="link" type="button" data-piece="${p.id}">${esc(p.num)}</button></td><td>${fdate(p.date)}</td><td>${esc(p.tiersNom||(isV?"Client comptoir":"—"))}</td>
    <td class="hide-sm sub">${(p.lignes||[]).slice(0,3).map(l=>esc(l.nom)+" × "+fnum(l.qte)).join(", ")}${(p.lignes||[]).length>3?"…":""}</td>
    <td class="num">${fm(p.totalTTC)}</td>

  </tbody></table></div>
  <div class="sum"><span><b>${rows.length}</b> ${isD?"devis":"pièce(s)"}</span><span>Total : <b>${fm(tot)}</b></span>${isD?"":`<span>${isV?"À encaisser":"À payer"} : <b>${fm(due)}</b></span>`}</div>`}

    <td class="num">${fm(g.tot)}<div class="sub">${g.n} pièce(s)</div></td><td class="num">${g.due>0.004?`<b style="color:var(--warn)">${fm(g.due)}</b>`:"—"}</td><td><div class="acts"><button class="btn sm ghost" type="button" data-edittiers="${t.id}">Modifier</button></div></td></tr>`}).join("")||`<tr><td colspan="6"><div class="empty"><strong>Aucun ${isC?"client":"fournisseur"}</strong>${isC?"Les clients sont ajoutés ici ou directement en tapant leur nom dans une vente. Pour une vente au comptoir, laissez le client vide.":"Les fournisseurs sont ajoutés ici ou en tapant leur nom dans un achat."}</div></td></tr>`}
  </tbody></table></div>`}

/* ---------- inventaire ---------- */
const hasQ=r=>r&&r.q!==""&&r.q!=null;
function invPlan(st){const out=[];for(const [id,r] of Object.entries(S.inv.rows)){const a=S.articles.get(id);if(!a||!hasQ(r))continue;const q=num(r.q);if(!(q>=0))continue;const s=st.get(id);const diff=Math.round((q-s.stock)*1000)/1000;if(diff!==0)out.push({a,s,q,diff,lot:(r.lot||"").trim(),per:r.per||""})}return out}
function seuilPlan(){const out=[];for(const [id,r] of Object.entries(S.inv.rows)){const a=S.articles.get(id);if(!a||r.seuil===""||r.seuil==null)continue;const v=num(r.seuil);if(v>=0&&v!==(+a.seuil||0))out.push({a,v})}return out}
function vInv({st}){
  if(!S.articles.size)return emptyArts();
  const I=S.inv;if(!CAT_KEYS.includes(I.cat))I.cat=CAT_KEYS[0]||"";const q=norm(I.q);const cnt={};for(const a of S.articles.values())cnt[a.cat]=(cnt[a.cat]||0)+1;
  const lotCol=!!CATS[I.cat]?.lot;
  const rows=sortedArticles().filter(a=>(a.cat===I.cat||(!CATS[a.cat]&&!I.cat))&&(!q||norm(a.nom+" "+(a.ref||"")).includes(q)));
  return `<div class="note"><p><b>Comptez ce qui est sur les étagères</b> et tapez la quantité trouvée ; laissez vide ce qui n'est pas compté. L'écart est ajouté (« Stock initial » ou « Inventaire ») ou retiré (« Ajustement inventaire ») au coût moyen. La colonne <b>Seuil</b> règle l'alerte « stock bas ». Touche Entrée = ligne suivante.</p></div>
  <div class="chips">${CAT_KEYS.map(k=>`<button class="chip" type="button" data-invcat="${k}" ${catDot(k)} aria-pressed="${I.cat===k}">${esc(CATS[k].label)}<b>${cnt[k]||0}</b></button>`).join("")}</div>
  <div class="toolbar"><label class="f">Date du comptage<input id="iDate" type="date" value="${I.date}"></label><label class="f grow">Rechercher<input id="iQ" type="search" placeholder="Filtrer la liste…" value="${esc(I.q)}"></label>
    <button class="btn" type="button" data-act="seuilsugg" title="Seuil = une semaine de ventes, calculée sur les 3 derniers mois">Proposer les seuils</button></div>
  <div class="tablebox inv"><table><thead><tr><th>Article</th><th class="num">Stock actuel</th><th>Quantité comptée</th>${lotCol?"<th>N° lot</th><th>Péremption</th>":""}<th class="num">Écart</th><th>Seuil</th></tr></thead><tbody>
  ${rows.map(a=>{const s=st.get(a.id),r=I.rows[a.id]||{};return `<tr class="${hasQ(r)?"touched":""}"><td class="nm"><b>${esc(a.nom)}</b><div class="sub">${a.ref?esc(a.ref)+" · ":""}${esc(a.unite||"")}${s.n?"":" · jamais saisi"}</div></td>
    <td class="num">${fnum(s.stock)}</td><td class="qc"><input id="iq-${a.id}" data-inv="q" data-id="${a.id}" type="number" min="0" step="any" inputmode="decimal" value="${esc(r.q??"")}" aria-label="Quantité comptée ${esc(a.nom)}"></td>
    ${lotCol?`<td class="lc"><input id="il-${a.id}" data-inv="lot" data-id="${a.id}" value="${esc(r.lot||"")}" aria-label="Lot"></td><td class="pc"><input id="ip-${a.id}" data-inv="per" data-id="${a.id}" type="date" value="${r.per||""}" aria-label="Péremption"></td>`:""}
    <td class="num"><span class="ec" id="ie-${a.id}">${ecart(a.id,st)}</span></td><td class="qc" style="width:90px"><input id="is-${a.id}" data-inv="seuil" data-id="${a.id}" type="number" min="0" step="any" value="${esc(r.seuil??(+a.seuil||0))}" aria-label="Seuil"></td></tr>`}).join("")||`<tr><td colspan="7"><div class="empty">Aucun article dans cette catégorie.</div></td></tr>`}
  </tbody></table></div><div class="savebar" id="savebar">${saveBar(invPlan(st))}</div>`}
function ecart(id,st){const r=S.inv.rows[id];if(!hasQ(r))return "";const q=num(r.q);if(!(q>=0))return "";const d=Math.round((q-st.get(id).stock)*1000)/1000;return d===0?'<span class="sub">=</span>':`<span class="${d>0?"up":"down"}">${d>0?"+":"−"}${fnum(Math.abs(d))}</span>`}
function saveBar(plan){const n=plan.length,nIn=plan.filter(p=>p.diff>0).length,counted=Object.values(S.inv.rows).filter(hasQ).length,ns=seuilPlan().length;
  if(S.invBusy)return `<p><b>Enregistrement en cours…</b></p>`;const parts=[];if(counted)parts.push(`<b>${counted}</b> article(s) compté(s) · <b>${n}</b> écart(s) (${nIn} en plus, ${n-nIn} en moins)`);if(ns)parts.push(`<b>${ns}</b> seuil(s) modifié(s)`);
  return `<p>${parts.join(" · ")||"Aucune quantité saisie pour l'instant."}</p>${counted||ns?`<button class="btn" type="button" data-act="invclear">Vider la saisie</button>`:""}<button class="btn in" type="button" data-act="invsave" ${n||ns?"":"disabled"}>Enregistrer l'inventaire</button>`}
function invDraft(){try{localStorage.setItem("rasid.inv",JSON.stringify(S.inv.rows))}catch{}}
function consoMois(id,months){const from=addDays(today(),-Math.round(months*30.44));let t=0;for(const m of S.mvts.values())if(m.articleId===id&&m.type==="sortie"&&m.motif==="Vente"&&m.date>=from)t+=+m.qte||0;return t/months}
function invSuggest(){let n=0;for(const a of S.articles.values()){if(a.cat!==S.inv.cat)continue;const c=consoMois(a.id,3);if(c>0){const v=Math.ceil(c/4.33);if(v!==(+a.seuil||0)){(S.inv.rows[a.id]||(S.inv.rows[a.id]={})).seuil=String(v);n++}}}
  invDraft();render();toast(n?`${n} seuil(s) proposé(s) : une semaine de ventes. Vérifiez puis enregistrez.`:"Pas assez de ventes enregistrées pour proposer des seuils")}
async function invSave(btn){const {st}=compute(),plan=invPlan(st),sp=seuilPlan();if(!plan.length&&!sp.length)return;
  if(!btn.dataset.sure){btn.dataset.sure=1;btn.textContent=`Confirmer : ${plan.length} mouvement(s)${sp.length?` + ${sp.length} seuil(s)`:""}`;return}
  const date=S.inv.date||today();S.invBusy=true;
  await batch(async()=>{for(const p of plan){const isIn=p.diff>0;
      await Store.put("mouvements",uid("m"),{type:isIn?"entree":"sortie",articleId:p.a.id,date,qte:Math.abs(p.diff),pu:isIn?r2(p.s.n?p.s.cump:(+p.a.pa||0)):null,lot:p.lot,peremption:isIn?p.per:"",motif:isIn?(p.s.n?"Inventaire":"Stock initial"):"Ajustement inventaire",tiers:"",note:`Inventaire : ${fnum(p.q)} compté(s)`,createdAt:new Date().toISOString()});
      const r=S.inv.rows[p.a.id];delete r.q;delete r.lot;delete r.per}
    for(const x of sp){const a={...x.a};delete a.id;a.seuil=x.v;await Store.put("articles",x.a.id,a);delete S.inv.rows[x.a.id].seuil}
    for(const [id,r] of Object.entries(S.inv.rows))if(!hasQ(r)&&!r.lot&&!r.per&&(r.seuil===""||r.seuil==null))delete S.inv.rows[id]});
  S.invBusy=false;invDraft();render();toast(`Inventaire enregistré (${plan.length+sp.length} opération(s))`)}

/* ---------- rapports ---------- */
function vRap(C){const R=S.rf;
  const seg=`<div class="seg" role="group" style="margin-bottom:14px">${[["ventes","Ventes et marge"],["valo","Stock valorisé"],["periode","Entrées / sorties par période"],["besoins","À commander"]].map(([k,t])=>`<button type="button" data-rview="${k}" aria-pressed="${R.view===k}">${t}</button>`).join("")}</div>`;
  return seg+({ventes:rVentes,valo:rValo,periode:rPeriode,besoins:rBesoins}[R.view])(C)}
const dates=(p)=>`<label class="f">Du<input id="rFrom" type="date" value="${S.rf.from}"></label><label class="f">Au<input id="rTo" type="date" value="${S.rf.to}"></label>`;
function ventesRows(C){const cost=C.cost;const R=S.rf;const ps=salesIn(R.from,R.to);const by=new Map();
  for(const p of ps)for(const m of C.byPiece.get(p.id)||[]){const l=(p.lignes||[]).find(x=>x.articleId===m.articleId);const a=S.articles.get(m.articleId);
    const x=by.get(m.articleId)||{nom:a?a.nom:(l?l.nom:"?"),cat:a?a.cat:"",q:0,ht:0,ttc:0,cost:0};x.q+=+m.qte||0;x.cost+=cost.get(m.id)||0;by.set(m.articleId,x)}
  for(const p of ps)for(const l of p.lignes||[]){const x=by.get(l.articleId);if(x){x.ht+=+l.totalHT||0;x.ttc+=+l.totalTTC||0}}
  return {ps,rows:[...by.values()].sort((a,b)=>b.ht-a.ht)}}
function rVentes(C){const {ps,rows}=ventesRows(C);const ttc=ps.reduce((a,p)=>a+(+p.totalTTC||0),0),ht=rows.reduce((a,x)=>a+x.ht,0),c=rows.reduce((a,x)=>a+x.cost,0);
  return `<div class="toolbar">${dates()}<span style="flex:1"></span><button class="btn" type="button" data-act="xrventes">Exporter (Excel)</button></div>
  <div class="tiles"><div class="tile eos"><span class="v money">${fm0(ttc)}</span><span class="l">Chiffre d'affaires TTC</span><span class="sub">${ps.length} vente(s) · panier moyen ${ps.length?fm0(ttc/ps.length):"—"}</span></div>
    <div class="tile hema"><span class="v money">${fm0(ht)}</span><span class="l">Chiffre d'affaires HT</span><span class="sub">TVA collectée ${fm0(ttc-ht)}</span></div>
    <div class="tile ok"><span class="v money">${fm0(ht-c)}</span><span class="l">Marge brute</span><span class="sub">${ht?Math.round((ht-c)/ht*100)+" % du CA HT":"—"} · coût des ventes ${fm0(c)}</span></div></div>
  <div class="tablebox"><table><thead><tr><th>Article</th><th class="num">Qté vendue</th><th class="num">CA HT</th><th class="num hide-sm">Coût</th><th class="num">Marge</th><th class="num hide-sm">Taux</th></tr></thead><tbody>
  ${rows.map(x=>`<tr><td class="nm">${esc(x.nom)}<div class="sub">${esc(catLabel(x.cat))}</div></td><td class="num">${fnum(x.q)}</td><td class="num">${fm(x.ht)}</td><td class="num hide-sm">${fm(x.cost)}</td><td class="num big">${fm(x.ht-x.cost)}</td><td class="num hide-sm">${x.ht?Math.round((x.ht-x.cost)/x.ht*100)+" %":"—"}</td></tr>`).join("")||`<tr><td colspan="6"><div class="empty">Aucune vente sur cette période.</div></td></tr>`}
  </tbody></table></div>`}
function rValo({st}){const R=S.rf;const rows=sortedArticles().filter(a=>R.cat==="all"||a.cat===R.cat);const byCat=new Map();let tot=0;
  for(const a of rows){const v=st.get(a.id).valeur;tot+=v;byCat.set(a.cat,(byCat.get(a.cat)||0)+v)}
  return `<div class="toolbar"><label class="f">Catégorie<select id="rCat"><option value="all">Toutes</option>${CAT_KEYS.map(k=>`<option value="${k}" ${R.cat===k?"selected":""}>${esc(CATS[k].label)}</option>`).join("")}</select></label><span style="flex:1"></span><button class="btn" type="button" data-act="xstock">Exporter (Excel)</button></div>
  <div class="tiles"><div class="tile hema"><span class="v money">${fm0(tot)}</span><span class="l">Valeur totale du stock</span><span class="sub">au coût d'achat moyen pondéré (HT)</span></div>
  ${[...byCat].sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`<div class="tile"><span class="v money" style="font-size:1.35rem">${fm0(v)}</span><span class="l">${esc(catLabel(k))}</span><span class="sub">${tot?Math.round(v/tot*100):0} % de la valeur</span></div>`).join("")}</div>
  <div class="tablebox"><table><thead><tr><th>Article</th><th class="num">Stock</th><th class="num">Coût moyen HT</th><th class="num">Valeur</th></tr></thead><tbody>
  ${rows.map(a=>{const s=st.get(a.id);return `<tr><td class="nm">${esc(a.nom)}<div class="sub">${a.ref?esc(a.ref)+" · ":""}${esc(catLabel(a.cat))}</div></td><td class="num">${fnum(s.stock)}</td><td class="num">${fm(s.cump)}</td><td class="num big">${fm(s.valeur)}</td></tr>`}).join("")}
  </tbody></table></div>`}
function periodeRows(){const R=S.rf,from=R.from||"0000",to=R.to||"9999";const map=new Map();
  for(const a of S.articles.values())if(R.cat==="all"||a.cat===R.cat)map.set(a.id,{a,init:0,in:0,out:0});
  for(const m of S.mvts.values()){const x=map.get(m.articleId);if(!x)continue;const q=+m.qte||0,sg=m.type==="entree"?1:-1;if(m.date<from)x.init+=sg*q;else if(m.date<=to){if(sg>0)x.in+=q;else x.out+=q}}
  return sortedArticles().map(a=>map.get(a.id)).filter(x=>x&&(x.in||x.out||x.init)).map(x=>({...x,fin:x.init+x.in-x.out}))}
function rPeriode(){const R=S.rf,rows=periodeRows();
  return `<div class="toolbar">${dates()}<label class="f">Catégorie<select id="rCat"><option value="all">Toutes</option>${CAT_KEYS.map(k=>`<option value="${k}" ${R.cat===k?"selected":""}>${esc(CATS[k].label)}</option>`).join("")}</select></label><span style="flex:1"></span><button class="btn" type="button" data-act="xperiode">Exporter (Excel)</button></div>
  <div class="tablebox"><table><thead><tr><th>Article</th><th class="num">Stock au ${fdate(R.from)||"début"}</th><th class="num">Entrées</th><th class="num">Sorties</th><th class="num">Stock au ${fdate(R.to)||"fin"}</th></tr></thead><tbody>
  ${rows.map(x=>`<tr><td class="nm">${esc(x.a.nom)}<div class="sub">${esc(catLabel(x.a.cat))}</div></td><td class="num">${fnum(x.init)}</td><td class="num" style="color:var(--hema)">${x.in?"+"+fnum(x.in):"0"}</td><td class="num" style="color:var(--eosin)">${x.out?"−"+fnum(x.out):"0"}</td><td class="num big">${fnum(x.fin)}</td></tr>`).join("")||`<tr><td colspan="5"><div class="empty">Aucun mouvement sur cette période.</div></td></tr>`}
  </tbody></table></div>`}
function besoinsRows(st){const B=S.bes,ref=+B.ref||3,cov=(+B.horizon||1)+(+B.secu||0);
  return sortedArticles().map(a=>{const moy=consoMois(a.id,ref),s=st.get(a.id).stock;const prop=Math.max(0,Math.ceil(moy*cov-s));return {a,moy,s,prop,cout:prop*(+a.pa||0)}}).filter(r=>r.prop>0).sort((x,y)=>y.cout-x.cout)}
function rBesoins({st}){const B=S.bes,rows=besoinsRows(st);const tot=rows.reduce((a,r)=>a+r.cout,0);
  return `<div class="note"><p><b>Quantité à commander</b> = ventes moyennes par mois × (${B.horizon} mois à couvrir + ${B.secu} mois de sécurité) − stock actuel. Le coût estimé utilise le dernier prix d'achat HT.</p></div>
  <div class="toolbar"><label class="f">Ventes des derniers<select id="besRef">${[1,3,6,12].map(n=>`<option value="${n}" ${+B.ref===n?"selected":""}>${n} mois</option>`).join("")}</select></label>
    <label class="f">Période à couvrir<select id="besHor">${[0.5,1,2,3,6].map(n=>`<option value="${n}" ${+B.horizon===n?"selected":""}>${n===0.5?"2 semaines":n+" mois"}</option>`).join("")}</select></label>
    <label class="f">Sécurité<select id="besSec">${[0,0.25,0.5,1].map(n=>`<option value="${n}" ${+B.secu===n?"selected":""}>${n===0?"aucune":n===0.25?"1 semaine":n===0.5?"2 semaines":"1 mois"}</option>`).join("")}</select></label>
    <span style="flex:1"></span><button class="btn" type="button" data-act="xbesoins">Exporter (Excel)</button></div>
  <div class="tablebox"><table><thead><tr><th>Article</th><th class="num">Ventes / mois</th><th class="num">Stock</th><th class="num">À commander</th><th class="num">Coût estimé HT</th><th class="num"></th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td class="nm">${esc(r.a.nom)}<div class="sub">${esc(catLabel(r.a.cat))}</div></td><td class="num">${fnum(Math.round(r.moy*10)/10)}</td><td class="num">${fnum(r.s)}</td><td class="num big">${fnum(r.prop)}</td><td class="num">${fm(r.cout)}</td><td><div class="acts"><button class="btn sm" type="button" data-buy="${r.a.id}" data-q="${r.prop}">＋ Achat</button></div></td></tr>`).join("")||`<tr><td colspan="6"><div class="empty">Rien à commander d'après les ventes récentes.</div></td></tr>`}
  </tbody></table></div><div class="sum"><span><b>${rows.length}</b> article(s)</span><span>Budget estimé : <b>${fm(tot)}</b></span></div>`}

  const first=root.querySelector("[autofocus]")||root.querySelector("input,select,button");if(first)first.focus();
  root.querySelector("#scrim").addEventListener("mousedown",e=>{if(e.target.id==="scrim")closeModal()})}
function closeModal(){$("#modalRoot").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(document.getElementById("camRoot")){closeCamOverlay();return}if($("#modalRoot").innerHTML)closeModal()});

function pieceLine(type,artId,q,pre){const a=artId?S.articles.get(artId):null;const tb=ttcBased(type);
  const pu=pre?pre.pu:(a?(tb?a.pv:a.pa):"");const tv=pre?pre.tva:(a?tvaOf(a):(org().tva??20));

function pieceCalc(type){const tb=ttcBased(type);let bHT=0,bTTC=0;const lines=[];
  document.querySelectorAll(".pl").forEach(l=>{const a=findArt(l.querySelector(".lArt").value),q=num(l.querySelector(".lQte").value),pu=num(l.querySelector(".lPu").value),t=num(l.querySelector(".lTva").value)||0;
    const rem=Math.min(Math.max(num(l.querySelector(".lRem").value)||0,0),100);
    let lht=0,lttc=0;if(q>0&&pu>=0){const net=q*pu*(1-rem/100);if(tb){lttc=net;lht=lttc/(1+t/100)}else{lht=net;lttc=lht*(1+t/100)}}
    bHT+=lht;bTTC+=lttc;lines.push({l,a,q,pu,t,rem,lht,lttc})});
  // remise globale : répartie sur toutes les lignes, pour garder une TVA juste par taux
  const gv=num($("#pGRem")?.value)||0,gt=$("#pGType")?.value||"%";const base=tb?bTTC:bHT;
  let f=1;if(gv>0&&base>0)f=gt==="%"?Math.max(0,1-Math.min(gv,100)/100):Math.max(0,1-Math.min(gv,base)/base);
  let ht=0,ttc=0,sb=0;for(const x of lines){x.bht=r2(x.lht);x.bttc=r2(x.lttc);sb+=tb?x.bttc:x.bht;x.lht=r2(x.lht*f);x.lttc=r2(x.lttc*f);ht+=x.lht;ttc+=x.lttc;x.l.querySelector(".lt").textContent=x.q>0&&x.pu>=0?fm(tb?x.bttc:x.bht):"—"}
  ht=r2(ht);ttc=r2(ttc);sb=r2(sb);const remG=r2(sb-(tb?ttc:ht));
  const box=$("#pTot");if(box){const byT={};for(const x of lines)if(x.q>0&&x.pu>=0)byT[x.t]=(byT[x.t]||0)+(x.lttc-x.lht);
    box.innerHTML=`${remG>0.004?`<span>Sous-total ${tb?"TTC":"HT"}</span><span>${fm(sb)}</span><span>Remise globale</span><span>− ${fm(remG)}</span>`:""}<span>Total HT</span><span>${fm(ht)}</span>${Object.entries(byT).map(([t,v])=>`<span>TVA ${fnum(t)} %</span><span>${fm(v)}</span>`).join("")}<span class="grand">Total TTC</span><span class="grand">${fm(ttc)}</span>`;
    const pm=$("#pMode"),pp=$("#pPaye");if(pm&&pp&&!pp.dataset.touched)pp.value=pm.value==="À crédit"?"0":r2(ttc).toFixed(2);
    const rc=$("#pRecu"),rd=$("#pRendu");if(rc&&rd){const v=num(rc.value);rd.textContent=v>0?(v>=ttc-0.004?"À rendre : "+fm(v-ttc):"Il manque "+fm(ttc-v)):""}
    const cw=$("#pRecuW");if(cw)cw.hidden=!(pm&&pm.value==="Espèces")}
  return {lines,ht,tva:r2(ttc-ht),ttc,remG,gv,gt,before:sb}}

function addByCode(code,type){const c=String(code||"").trim();if(!c)return false;const n=norm(c);

let audioCtx=null;
function beep(ok){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=ok?1250:300;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+(ok?.12:.3));o.start();o.stop(audioCtx.currentTime+(ok?.13:.31))}catch{}}

function pieceDetail(id,fresh){const p=S.pieces.get(id);if(!p)return;const isV=p.type==="vente",isD=p.type==="devis",isA=p.type==="achat",tb=ttcBased(p.type);const r=isD?0:pieceReste(p);

  @page{size:${w}mm auto;margin:2mm}*{box-sizing:border-box}body{margin:0;width:${w-4}mm;font:${w<70?"10.5px":"12px"}/1.35 "Courier New",ui-monospace,monospace;color:#000}
  .c{text-align:center}.b{font-weight:700}.big{font-size:1.35em}.sep{border-top:1px dashed #000;margin:5px 0}
  table{width:100%;border-collapse:collapse}td{vertical-align:top;padding:1px 0}td.r{text-align:right;white-space:nowrap}img{max-width:60%;max-height:22mm;display:block;margin:0 auto 4px}

  <div class="sep"></div><table><tr><td>Ticket ${esc(p.num)}</td><td class="r">${fdate(p.date)} ${hh}</td></tr>${p.tiersNom?`<tr><td colspan="2">Client : ${esc(p.tiersNom)}</td></tr>`:""}</table><div class="sep"></div>
  <table>${L.map(l=>`<tr><td colspan="2">${esc(l.nom)}</td></tr><tr><td>&nbsp;${fnum(l.qte)} x ${fm(l.pu)}${l.remise?` -${fnum(l.remise)}%`:""}</td><td class="r">${fm(lineAmt(l,true))}</td></tr>`).join("")}</table>
  <div class="sep"></div><table>${p.remiseGlobale?`<tr><td>Remise</td><td class="r">-${fm(p.remiseGlobale.montant)}</td></tr>`:""}

  <tr><td>${esc(p.mode||"")}</td><td class="r">${fm(p.paye)}</td></tr>${p.recu>0?`<tr><td>Reçu</td><td class="r">${fm(p.recu)}</td></tr><tr class="b"><td>Rendu</td><td class="r">${fm(p.rendu)}</td></tr>`:""}
  ${pieceReste(p)>0.004?`<tr class="b"><td>Reste dû</td><td class="r">${fm(pieceReste(p))}</td></tr>`:""}</table>
  <div class="sep"></div><div class="c">${L.reduce((a,l)=>a+(+l.qte||0),0)} article(s)</div>${O.pied?`<div class="c" style="margin-top:4px">${esc(O.pied)}</div>`:""}<div style="height:6mm"></div>

/* ---------- caméra : lecture de code-barres (fenêtre au-dessus du formulaire ouvert) ---------- */
let camStream=null,camTimer=null,zxReader=null;
function closeCamOverlay(){clearInterval(camTimer);camTimer=null;try{zxReader&&zxReader.reset()}catch{};zxReader=null;if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}
  const r=document.getElementById("camRoot");if(r)r.remove();const s=$("#pScan");if(s)s.focus()}
async function openCamOverlay(onCode){closeCamOverlay();
  const root=document.createElement("div");root.id="camRoot";root.innerHTML=`<div class="scrim" style="z-index:40"><div class="modal" role="dialog" aria-modal="true" aria-label="Scanner un code-barres">
  <div class="mh"><h3>Scanner un code-barres</h3><button class="btn ghost" type="button" id="camClose" aria-label="Fermer">✕</button></div>
  <div class="mb"><div style="position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%"><video id="camV" playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
    <div style="position:absolute;left:10%;right:10%;top:40%;height:20%;border:2px solid rgb(255 255 255 / .85);border-radius:10px;box-shadow:0 0 0 999px rgb(0 0 0 / .25)"></div></div>
    <p class="hint" id="camMsg" style="margin:0">Placez le code-barres dans le cadre. Chaque code lu est ajouté ; touchez « Terminer » quand vous avez fini.</p><div id="camLast" class="avail" hidden></div></div>
  <div class="mf"><button class="btn in" type="button" id="camDone">Terminer</button></div></div></div>`;
  document.body.appendChild(root);root.querySelector("#camClose").onclick=closeCamOverlay;root.querySelector("#camDone").onclick=closeCamOverlay;
  const msg=t=>{const m=document.getElementById("camMsg");if(m)m.textContent=t};
  let last="",lastT=0;const hit=code=>{const now=Date.now();if(code===last&&now-lastT<1800)return;last=code;lastT=now;const ok=onCode(code);const bx=document.getElementById("camLast");if(bx){bx.hidden=false;bx.innerHTML=(ok?"✓ ":"✗ ")+esc(code)}};
  window.__camHit=hit;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg("La caméra n'est pas disponible ici. Ouvrez l'application depuis son adresse https (version en ligne), ou utilisez une douchette USB.");return}
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280}},audio:false})}
  catch(e){msg(e&&e.name==="NotAllowedError"?"Accès à la caméra refusé. Autorisez la caméra pour ce site dans le navigateur, puis réessayez.":"Caméra introuvable ou déjà utilisée par une autre application.");return}
  if(!document.getElementById("camRoot")){camStream.getTracks().forEach(t=>t.stop());camStream=null;return}
  const v=document.getElementById("camV");v.srcObject=camStream;try{await v.play()}catch{}
  const formats=["ean_13","ean_8","upc_a","upc_e","code_128","code_39","itf","qr_code"];
  if("BarcodeDetector" in window){try{const sup=await window.BarcodeDetector.getSupportedFormats();const det=new window.BarcodeDetector({formats:sup.filter(f=>formats.includes(f))});
      camTimer=setInterval(async()=>{if(!camStream||v.readyState<2)return;try{const r=await det.detect(v);if(r&&r[0])hit(r[0].rawValue)}catch{}},250);return}catch{}}
  if(window.ZXing){try{zxReader=new window.ZXing.BrowserMultiFormatReader(undefined,300);zxReader.decodeFromStream(camStream,v,res=>{if(res)hit(res.getText())});return}catch{}}

async function importXlsx(file){if(!needXLSX())return;const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});

  const c={ref:ci(/ref|code/),nom:ci(/designation|libelle|produit|article/),cat:ci(/categ|famille|rayon/),u:ci(/unite/),pa:ci(/achat|cout|pa\b/),pv:ci(/vente|pv\b|prix ttc/),tva:ci(/tva/),seuil:ci(/seuil|min/),stock:ci(/stock|quantite|qte/)};
  const catBy=new Map([...S.cats.values()].map(x=>[norm(x.label),x.id]));const ex=new Set([...S.articles.values()].map(a=>norm(a.ref)||"n:"+norm(a.nom)));
  let added=0,skipped=0,stocked=0;const now=new Date().toISOString();
  await batch(async()=>{let ordre=Math.max(0,...[...S.cats.values()].map(x=>x.ordre||0));
    for(const r of rows.slice(hi+1)){const nom=String(r[c.nom]??"").trim();if(!nom)continue;const ref=c.ref>=0&&r[c.ref]!=null?String(r[c.ref]).trim():"";
      const key=norm(ref)||"n:"+norm(nom);if(ex.has(key)||(!ref&&ex.has("n:"+norm(nom)))){skipped++;continue}ex.add(key);
      const cl=c.cat>=0&&r[c.cat]?String(r[c.cat]).trim():"Divers";let cid=catBy.get(norm(cl));if(!cid){cid=uid("c");catBy.set(norm(cl),cid);await Store.put("categories",cid,{label:cl,lot:false,ordre:++ordre})}

    ["c2","6112001","Eau minérale 1,5 L","Bouteille",3.4,5,20,24],["c2","6112002","Soda 1 L","Bouteille",6.5,9,20,12],["c2","6112003","Jus d'orange 1 L","Brique",8.4,12,20,6],["c2","6112004","Café moulu 250 g","Paquet",17,24,20,4],
    ["c3","6113001","Lait UHT 1 L","Brique",5.6,7,0,24],["c3","6113002","Yaourt nature (pack de 4)","Pack",6.3,9,20,10],["c3","6113003","Fromage fondu 8 portions","Boîte",9,12.5,20,6],["c3","6113004","Beurre 250 g","Plaquette",15,20,20,5],
    ["c4","6114001","Savon de Marseille","Unité",4.5,7,20,10],["c4","6114002","Lessive en poudre 1 kg","Paquet",18,25,20,5],["c4","6114003","Eau de Javel 1 L","Bouteille",4,6.5,20,8],["c4","6114004","Papier toilette (6 rouleaux)","Paquet",12.5,17,20,6],["c4","6114005","Dentifrice 75 ml","Tube",8,12,20,5]];
  const init=[30,12,40,25,20,40,30,15,50,96,36,18,12,96,24,18,12,30,15,20,18,14];
  const clients=[["t1","Café Atlas","0536 00 00 01","ICE 000000000000001"],["t2","Mme Benali","0661 00 00 02",""],["t3","Snack Le Palmier","0536 00 00 03","ICE 000000000000003"]];
  const fours=[["f1","Distributeur Grossiste Exemple","0536 10 00 00"],["f2","Laiterie Exemple","0536 20 00 00"]];
  await batch(async()=>{
    await Store.put("config","org",{nom:"Magasin Exemple",activite:"Alimentation générale — données d'exemple",adresse:"12, avenue Exemple",ville:"Oujda",tel:"0536 00 00 00",email:"",ice:"000000000000000",rc:"00000",idf:"00000000",patente:"00000000",devise:"DH",tva:20,pied:"Merci de votre confiance.",logo:""});
    for(const [i,[id,l,lot]] of cats.entries())await Store.put("categories",id,{label:l,lot,ordre:i+1});
    for(const [id,n,tel,ice] of clients)await Store.put("tiers",id,{type:"client",nom:n,tel,ice:ice.replace("ICE ",""),adresse:"Oujda"});
    for(const [id,n,tel] of fours)await Store.put("tiers",id,{type:"fournisseur",nom:n,tel,ice:"",adresse:"Oujda"});
    for(const [i,a] of arts.entries()){const [cat,ref,nom,unite,pa,pv,tva,seuil]=a;const id="a"+(i+1);await Store.put("articles",id,{cat,ref,nom,unite,pa,pv,tva,seuil});
      await Store.put("mouvements","mi"+(i+1),{type:"entree",articleId:id,date:d0,qte:init[i],pu:pa,lot:cat==="c3"?"L"+(240+i):"",peremption:cat==="c3"?addDays(today(),i%2?20:70):"",motif:"Stock initial",tiers:"",note:"Données d'exemple",createdAt:now()})}
    let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;let fa=0,br=0;
    const mkPiece=async(type,date,tid,tnom,lines,payFrac,mode)=>{const isV=type==="vente";const id=uid("p");const num_=PREFIX[type]+"-"+date.slice(0,4)+"-"+String(isV?++fa:++br).padStart(4,"0");let ht=0,ttc=0;const L=[];
      for(const [ai,q] of lines){const a=arts[ai];const pu=isV?a[5]:a[4],t=a[6];let lht,lttc;if(isV){lttc=r2(q*pu);lht=lttc/(1+t/100)}else{lht=r2(q*pu);lttc=lht*(1+t/100)}ht+=lht;ttc+=lttc;
        L.push({articleId:"a"+(ai+1),ref:a[1],nom:a[2],unite:a[3],qte:q,pu,tva:t,totalHT:r2(lht),totalTTC:r2(lttc),lot:"",peremption:""});
        await Store.put("mouvements",uid("m"),{type:isV?"sortie":"entree",articleId:"a"+(ai+1),date,qte:q,pu:isV?null:pu,puVente:isV?r2(lht/q*10000)/10000:null,lot:"",peremption:"",motif:isV?"Vente":"Achat",tiers:tnom,pieceId:id,note:num_,createdAt:date+"T10:00:00Z"})}
      const paye=r2(ttc*payFrac);await Store.put("pieces",id,{type,num:num_,date,tiersId:tid,tiersNom:tnom,refFournisseur:"",lignes:L,totalHT:r2(ht),totalTVA:r2(ttc-ht),totalTTC:r2(ttc),mode:payFrac>=1?mode:"À crédit",paye,paiements:paye>0?[{date,montant:paye,mode}]:[],note:"",createdAt:date+"T10:00:00Z"})};
    const stock=init.slice();
    for(let day=70;day>=0;day--){const date=addDays(today(),-day);
      if(day===40)await mkPiece("achat",date,"f1",fours[0][1],[[0,24],[2,20],[9,48],[5,30]],1,"Virement").then(()=>{stock[0]+=24;stock[2]+=20;stock[9]+=48;stock[5]+=30});
      if(day===20)await mkPiece("achat",date,"f2",fours[1][1],[[13,48],[14,12]],0,"Virement").then(()=>{stock[13]+=48;stock[14]+=12});
      const nv=1+Math.floor(rnd()*3);for(let k=0;k<nv;k++){const lines=[];const nl=1+Math.floor(rnd()*3);for(let j=0;j<nl;j++){const ai=Math.floor(rnd()*arts.length);const q=1+Math.floor(rnd()*3);if(stock[ai]-q>=2&&!lines.some(x=>x[0]===ai)){lines.push([ai,q]);stock[ai]-=q}}
        if(!lines.length)continue;const c=rnd();const cl=c<0.12?clients[0]:c<0.2?clients[1]:c<0.27?clients[2]:null;
        await mkPiece("vente",date,cl?cl[0]:"",cl?cl[1]:"",lines,cl&&rnd()<0.5?0:1,rnd()<0.8?"Espèces":"Carte bancaire")}}
  });
  toast("Magasin d'exemple chargé : vous pouvez tout effacer depuis le menu Données")}

/* =================== événements =================== */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button");const pop=$("#pop");
  if(!t||!t.closest(".menu")){pop.hidden=true;$("#bMenu").setAttribute("aria-expanded","false")}
  if(!t)return;const d=t.dataset;
  if(t.id==="bMenu"){pop.hidden=!pop.hidden;t.setAttribute("aria-expanded",String(!pop.hidden));return}
  if(t.id==="bVente")return pieceForm("vente");
  if(t.id==="bAchat")return pieceForm("achat");
  if("close" in d)return closeModal();
  if(d.tab){closeModal();S.tab=d.tab;render();window.scrollTo(0,0);return}
  if(d.goto){S.tab="rap";S.rf.view=d.goto==="valo"?"valo":"ventes";if(d.goto==="credit"){S.tab="ventes";S.vf.statut="due"}render();return}
  if(d.gotoa){S.tab="arts";S.af.cat="all";S.af.statut=d.gotoa;render();return}
  if(d.cat){S.af.cat=d.cat;S.af.statut="all";render();return}
  if(d.invcat){S.inv.cat=d.invcat;S.inv.q="";render();return}
  if(d.ttype){S.tf.type=d.ttype;render();return}
  if(d.rview){S.rf.view=d.rview;render();return}
  if(d.art)return artDetail(d.art);
  if(d.editart){closeModal();return artForm(S.articles.get(d.editart))}
  if(d.buy){closeModal();return pieceForm("achat",d.buy,d.q)}
  if(d.sell){closeModal();return pieceForm("vente",d.sell)}
  if(d.new)return pieceForm(d.new);
  if(d.piece)return pieceDetail(d.piece);
  if(d.pdf){const p=S.pieces.get(d.pdf);if(p)pdfPiece(p);return}
  if(d.ticket){const p=S.pieces.get(d.ticket);if(p)printTicket(p);return}
  if(d.todevis){closeModal();return pieceForm("vente",null,null,{from:d.todevis})}
  if(d.cam==="piece"){return openCamOverlay(c=>window.__scan?window.__scan(c):false)}
  if(d.cam==="ref"){return openCamOverlay(c=>{const i=$("#aRef");if(i){i.value=c;beep(true);setTimeout(closeCamOverlay,200);return true}return false})}
  if(d.cam==="search"){return openCamOverlay(c=>{const n=norm(c);const a=[...S.articles.values()].find(x=>x.ref&&norm(x.ref)===n);if(a){beep(true);setTimeout(()=>{closeCamOverlay();artDetail(a.id)},150);return true}beep(false);toast("Aucun article avec le code "+c);return false})}
  if(d.tiers)return tiersForm(S.tiers.get(d.tiers));
  if(d.edittiers)return tiersForm(S.tiers.get(d.edittiers));
  if(d.newtiers)return tiersForm(null,d.newtiers);
  if(d.editm){const m=S.mvts.get(d.editm);if(m)mvForm(m);return}
  if("addline" in d){window.__addLine&&window.__addLine();return}
  if("rmline" in d){t.closest(".pl").remove();pieceCalc(window.__ptype||"vente");return}
  if(d.catsave){const v=$("#cn-"+d.catsave).value.trim();const c=S.cats.get(d.catsave);if(v&&c&&await safe(()=>Store.put("categories",c.id,{label:v,lot:$("#cl-"+d.catsave).checked,ordre:c.ordre||0}),"Catégorie enregistrée"))catsForm();return}
  if(d.catdel){if(confirmBtn(t)&&await safe(()=>Store.del("categories",d.catdel),"Catégorie supprimée")){if(S.af.cat===d.catdel)S.af.cat="all";catsForm()}return}
  const act=d.act;if(!act)return;if(act!=="wipe")pop.hidden=true;
  ({org:orgForm,cats:catsForm,newart:()=>artForm(),import:()=>$("#fileXlsx").click(),model:excelModel,restore:()=>$("#fileJson").click(),backup,xstock:exportStock,xvente:()=>exportPieces("vente"),xachat:()=>exportPieces("achat"),
    xmvts:exportMvts,xrventes:exportRVentes,xperiode:exportPeriode,xbesoins:exportBesoins,othermv:()=>mvForm(),demo:loadDemo,wipe:()=>wipe(t),pw:pwForm,logout:()=>Store.logout(),
    clearf:()=>{S.af.statut="all";S.af.q="";render()},seuilsugg:invSuggest,invsave:()=>invSave(t),
    invclear:()=>{if(confirmBtn(t,"Confirmer : tout vider")){S.inv.rows={};invDraft();render()}}})[act]?.();
});
const bind={aQ:v=>S.af.q=v,aSt:v=>S.af.statut=v,vFrom:v=>S.vf.from=v,dFrom:v=>S.df.from=v,dTo:v=>S.df.to=v,dSt:v=>S.df.statut=v,dQ:v=>S.df.q=v,vTo:v=>S.vf.to=v,vSt:v=>S.vf.statut=v,vQ:v=>S.vf.q=v,hFrom:v=>S.hf.from=v,hTo:v=>S.hf.to=v,hSt:v=>S.hf.statut=v,hQ:v=>S.hf.q=v,
  mFrom:v=>S.mf.from=v,mTo:v=>S.mf.to=v,mType:v=>S.mf.type=v,mQ:v=>S.mf.q=v,tQ:v=>S.tf.q=v,rFrom:v=>S.rf.from=v,rTo:v=>S.rf.to=v,rCat:v=>S.rf.cat=v,
  besRef:v=>S.bes.ref=+v,besHor:v=>S.bes.horizon=+v,besSec:v=>S.bes.secu=+v,iDate:v=>S.inv.date=v,iQ:v=>S.inv.q=v};
$("#view").addEventListener("input",e=>{const t=e.target;
  if(t.dataset.inv){const id=t.dataset.id;const r=S.inv.rows[id]||(S.inv.rows[id]={});r[t.dataset.inv]=t.value;if(!hasQ(r)&&!r.lot&&!r.per&&(r.seuil===""||r.seuil==null))delete S.inv.rows[id];invDraft();
    const {st}=compute();$("#savebar").innerHTML=saveBar(invPlan(st));const ec=$("#ie-"+id);if(ec)ec.innerHTML=ecart(id,st);t.closest("tr").classList.toggle("touched",hasQ(S.inv.rows[id]));return}
